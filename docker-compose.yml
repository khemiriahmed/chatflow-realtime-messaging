services:
  postgres:
    image: postgres:16-alpine
    container_name: chatflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatflow
      POSTGRES_USER: ${DB_USERNAME:-chatflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chatflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chatflow} -d chatflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chatflow
      DB_USERNAME: ${DB_USERNAME:-chatflow}
      DB_PASSWORD: ${DB_PASSWORD:-chatflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see .env.example}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900s}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-chatflow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-chatflow-web}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:4200}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: chatflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
