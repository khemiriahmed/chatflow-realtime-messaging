spring:
  application:
    name: chatflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatflow}
    username: ${DB_USERNAME:chatflow}
    password: ${DB_PASSWORD:chatflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900s}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
  issuer: ${JWT_ISSUER:chatflow}
  audience: ${JWT_AUDIENCE:chatflow-web}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
